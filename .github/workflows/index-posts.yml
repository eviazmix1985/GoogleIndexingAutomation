name: Index Blogger Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' 

jobs:
  index-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create service account file
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > service-account-key.json
        shell: bash

      - name: Run indexing script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account-key.json
          BLOG_URL: "https://www.eviazoom.gr"
          MAX_REQUESTS_PER_DAY: 200
          FORCE_REINDEX: false
          BLOGGER_RSS_FEED: "https://eviazoom.gr/feeds/posts/default?start-index=1&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=501&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=1001&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=1501&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=2001&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=2501&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=3001&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=3501&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=4001&max-results=500&orderby=published,https://eviazoom.gr/feeds/posts/default?start-index=4501&max-results=500&orderby=published"
        run: |
          python src/indexer.py
